name: Update Streak Stats

on:
  schedule:
    - cron: "0 0 * * *" # Chạy tự động mỗi ngày 1 lần vào lúc 00:00 UTC
  workflow_dispatch: # Cho phép bấm chạy thủ công trong tab Actions bất cứ lúc nào

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Streak SVG
        uses: denvercoder1/github-readme-streak-stats-action@v1
        with:
          username: BinCry
          theme: radical
          hide_border: true
          output: profile/streak.svg

      - name: Commit and Push SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "chore: update streak stats svg" || exit 0
          git push
